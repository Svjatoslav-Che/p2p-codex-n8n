services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: local-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file:
      - .env
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Europe/Madrid
      TZ: Europe/Madrid
      NODE_ENV: production
      N8N_SECURE_COOKIE: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.runtime/n8n:/home/node/.n8n
      - ./.runtime/local-files:/files

